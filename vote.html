<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2f55">
<title>Occam's Quest · Answer</title>
<style>
:root{--ink:#1b1b2a;--paper:#fbf7e8;--rule:#c9bf9c;--purple:#5a2d82;--gold:#ffd54f;--ok:#2b8a3e;--no:#c0392b;
  --font:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);
  background:linear-gradient(#bfe0ff 0%,#e9f5ff 22%,#cde9a8 22%,#a8d47a 100%) fixed}
main{max-width:520px;margin:0 auto;padding:16px 16px 32px}
h1{margin:8px 0 16px;text-align:center;font-size:20px;letter-spacing:.06em;color:var(--gold);
  text-shadow:0 2px 0 #b5521e,0 4px 0 #5a2410}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--rule);padding:18px}
.who{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--purple);margin-bottom:8px}
.q{font-size:19px;font-weight:800;line-height:1.35;margin-bottom:16px}
.opts{display:grid;gap:10px}
button.opt{font:inherit;font-size:16px;text-align:left;color:var(--ink);display:flex;gap:12px;align-items:center;width:100%;
  padding:14px;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer;min-height:56px;
  transition:transform .1s,background .2s}
button.opt:active{transform:scale(.98)}
button.opt .l{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;font-weight:800}
button.opt.sel{background:#efe3fb;border-color:var(--purple);box-shadow:0 0 0 3px #c9a8ec}
button.opt.right{background:#dff3e3;border-color:var(--ok)} button.opt.right .l{background:var(--ok)}
button.opt:disabled{cursor:default}
.closed button.opt:not(.sel):not(.right){opacity:.55}
.status{margin-top:16px;text-align:center;font-weight:700;font-size:15px;min-height:1.4em}
.status.ok{color:var(--ok)} .status.no{color:var(--no)}
.wait{text-align:center;line-height:1.6}
.wait .big{font-size:40px}
.dot{display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.foot{margin-top:14px;text-align:center;font-size:11px;opacity:.6}
</style>
</head>
<body>
<main>
  <h1>OCCAM’S QUEST</h1>
  <div class="panel" id="card"><div class="wait"><div class="big">⏳</div>Connecting<span class="dot">…</span></div></div>
  <div class="foot" id="foot"></div>
</main>

<script src="live-config.js"></script>
<script>
(()=>{
'use strict';
const card=document.getElementById('card'), foot=document.getElementById('foot');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=html=>{card.innerHTML=html;};
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

const C=window.OQ_LIVE;
if(!C||!C.server||/YOUR_/.test(C.server)){
  show(`<div class="wait"><div class="big">⚠️</div>Live voting isn’t set up yet.</div>`); return;
}
let me=store.get('oq.voter');
if(!me||!/^[a-z0-9]{6,40}$/.test(me)){ me=(Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,30); store.set('oq.voter',me); }
const wsUrl=C.server.replace(/^http/,'ws').replace(/\/+$/,'')+'/ws?v='+me;

let cur=null, mine=null, ws=null, connected=false, everConnected=false, sendFailed=false;
const pickKey=n=>`oq.pick.${n}`;

function render(){
  if(!everConnected){ show(`<div class="wait"><div class="big">⏳</div>Connecting<span class="dot">…</span></div>`); return; }
  foot.textContent=connected?'● connected':'○ reconnecting…';
  if(!cur||!Array.isArray(cur.options)){
    card.className='panel';
    show(`<div class="wait"><div class="big">🎮</div>You’re in! Waiting for the next question<span class="dot">…</span><br><small>Keep this page open.</small></div>`); return;
  }
  const local=store.get(pickKey(cur.n));
  const pick=mine!=null?mine:(local!=null?+local:null);
  const closed=!cur.open, graded=closed&&cur.answer!=null;
  card.className='panel'+(closed?' closed':'');
  show(`<div class="who">❓ QUICK QUESTION</div><div class="q">${esc(cur.q)}</div>
    <div class="opts">${cur.options.map((o,i)=>`<button class="opt${i===pick?' sel':''}${graded&&i===cur.answer?' right':''}" data-i="${i}" ${closed?'disabled':''}><span class="l">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="status" id="st"></div>`);
  const st=document.getElementById('st');
  if(closed){
    if(graded&&pick!=null){ st.className='status '+(pick===cur.answer?'ok':'no'); st.textContent=pick===cur.answer?'✓ Correct! Look at the big screen.':'✗ Not quite. Look at the big screen.'; }
    else st.textContent='Voting closed. Look at the big screen 👀';
  } else if(sendFailed){ st.className='status no'; st.textContent='Not sent yet: reconnecting…'; }
  else if(pick!=null) st.textContent='✓ Answer sent. You can still change it.';
  card.querySelectorAll('button.opt').forEach(b=>b.onclick=()=>vote(+b.dataset.i));
}

function vote(i){
  if(!cur||!cur.open) return;
  store.set(pickKey(cur.n),String(i)); mine=i;
  if(ws&&ws.readyState===1){ ws.send(JSON.stringify({t:'vote',n:cur.n,i})); sendFailed=false; }
  else sendFailed=true;
  if(navigator.vibrate) navigator.vibrate(30);
  render();
}

let retry=1000;
function connect(){
  try{ ws=new WebSocket(wsUrl); }catch(e){ setTimeout(connect,3000); return; }
  ws.onopen=()=>{ connected=everConnected=true; retry=1000;
    // resend an answer that was tapped while offline
    if(sendFailed&&cur&&cur.open&&mine!=null){ ws.send(JSON.stringify({t:'vote',n:cur.n,i:mine})); sendFailed=false; }
    render(); };
  ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
    if(m.t==='state'){ const changed=!cur||!m.cur||cur.n!==m.cur.n; cur=m.cur; if(changed&&!sendFailed) mine=null; if(m.mine!=null) mine=m.mine; render(); } };
  ws.onclose=()=>{ connected=false; render(); setTimeout(connect,retry); retry=Math.min(retry*2,10000); };
}
// phones put pages to sleep; reconnect straight away when the page is visible again
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&ws&&ws.readyState>1) connect(); });
connect();
render();
})();
</script>
</body>
</html>
